<script type="application/ld+json">
{
  "@context": "https://schema.org",
  {{ if .IsHome -}}
  "@type": "Person",
  "name": {{ .Site.Params.author.name | jsonify }},
  "url": {{ .Site.BaseURL | jsonify }},
  "image": {{ .Site.Params.author.image | absURL | jsonify }},
  "jobTitle": {{ .Site.Params.author.title | default "Tech Professional" | jsonify }},
  "description": {{ .Site.Params.author.description | jsonify }},
  "sameAs": [
    {{- range $index, $link := hugo.Data.social.links -}}
      {{- if $index -}},{{- end -}}
      {{ $link.url | jsonify }}
    {{- end -}}
  ]
  {{- else if .IsPage -}}
  "@type": "BlogPosting",
  "headline": {{ .Title | jsonify }},
  "datePublished": {{ .Date.Format "2006-01-02T15:04:05Z07:00" | jsonify }},
  "dateModified": {{ .Lastmod.Format "2006-01-02T15:04:05Z07:00" | jsonify }},
  "author": {
    "@type": "Person",
    "name": {{ .Site.Params.author.name | jsonify }},
    "url": {{ .Site.BaseURL | jsonify }}
  },
  "description": {{ .Description | default (.Summary | plainify | truncate 160) | jsonify }},
  "image": {{ if .Params.image }}{{ .Params.image | absURL | jsonify }}{{ else }}{{ .Site.Params.image | absURL | jsonify }}{{ end }},
  "mainEntityOfPage": {
    "@type": "WebPage",
    "@id": {{ .Permalink | jsonify }}
  }
  {{- else if eq .Section "services" -}}
  "@type": "Service",
  "serviceType": {{ .Title | jsonify }},
  "provider": {
    "@type": "Person",
    "name": {{ .Site.Params.author.name | jsonify }}
  },
  "description": {{ .Description | default (.Summary | plainify | truncate 160) | jsonify }},
  "areaServed": "Global",
  "hasOfferCatalog": {
    "@type": "OfferCatalog",
    "name": "Professional Services",
    "itemListElement": [
      {
        "@type": "Offer",
        "itemOffered": {
          "@type": "Service",
          "name": {{ .Title | jsonify }}
        }
      }
    ]
  }
  {{- end }}
}
</script>

{{- if eq .Title "About me" -}}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "FAQPage",
  "mainEntity": [
    {
      "@type": "Question",
      "name": "What exactly do your advisory services entail?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "I provide high-level technical consulting, systems architecture planning, and strategic direction for businesses looking to modernize their infrastructure or build new technical products."
      }
    },
    {
      "@type": "Question",
      "name": "What do you mean by Digital Sovereignty?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Digital sovereignty is the operational independence of a business. Relying entirely on rented, proprietary cloud ecosystems creates vulnerability and vendor lock-in."
      }
    },
    {
      "@type": "Question",
      "name": "Who is the ideal client for Julz Insight?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "We partner with progressive African enterprises, forward-thinking SMEs, and operational leaders (CIOs, CTOs) who are ready to abandon fragmented, proprietary, and/or legacy systems."
      }
    }
  ]
}
</script>
{{- end -}}

<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BreadcrumbList",
  "itemListElement": [
    {
      "@type": "ListItem",
      "position": 1,
      "name": "Home",
      "item": {{ .Site.BaseURL | jsonify }}
    }
    {{- if not .IsHome -}}
    ,{
      "@type": "ListItem",
      "position": 2,
      "name": {{ .Section | humanize | jsonify }},
      "item": {{ (printf "%s%s/" .Site.BaseURL .Section) | jsonify }}
    },
    {
      "@type": "ListItem",
      "position": 3,
      "name": {{ .Title | jsonify }},
      "item": {{ .Permalink | jsonify }}
    }
    {{- end -}}
  ]
}
</script>
