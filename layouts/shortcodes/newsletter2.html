<style>
.newsletter-section {
  text-align: center;
  margin: 2rem auto;
  font-family: 'Poppins', sans-serif;
}

.newsletter-nudge {
  font-weight: 600;
  color: #6320d6;
  margin-bottom: 0.5rem;
}

.newsletter-form {
  display: flex;
  justify-content: center;
  border-radius: 30px;
  overflow: hidden;
  max-width: 500px;
  margin: 0 auto;
}

.newsletter-form input[type="email"] {
  flex: 1;
  padding: 12px 16px;
  border: 2px solid #6320d6;
  border-right: none;
  border-radius: 30px 0 0 30px;
  font-size: 1rem;
}

.newsletter-form input[type="email"]::placeholder {
  color: #888;
}

.newsletter-form button {
  padding: 12px 20px;
  background-color: #6320d6;
  color: #fff;
  border: none;
  border-radius: 0 30px 30px 0;
  font-weight: 600;
  cursor: pointer;
  transition: background-color 0.3s ease;
}

.newsletter-form button:hover {
  background-color: #4b18a3;
}

.newsletter-reassurance {
  font-size: 0.85rem;
  color: #555;
  margin-top: 0.5rem;
}

@media only screen and (max-width: 768px) {
  .newsletter-form {
    flex-direction: column;
    border-radius: 30px;
  }

  .newsletter-form input[type="email"],
  .newsletter-form button {
    border-radius: 30px;
    border: 2px solid #6320d6;
    margin: 0.25rem 0;
  }

  .newsletter-form button {
    border: none;
  }
}
</style>

<div class="newsletter-section" id="newsletter">
  <p class="newsletter-nudge">📬 Join 586+ readers</p>
  <form action="https://buttondown.com/api/emails/embed-subscribe/ajulu" 
        method="post" 
        target="popupwindow" 
        onsubmit="window.open('https://buttondown.com/ajulu', 'popupwindow')" 
        class="embeddable-buttondown-form newsletter-form">
    <input type="email" name="email" id="bd-email" placeholder="Enter your email" required>
    <button type="submit">Subscribe</button>
  </form>
  <p class="newsletter-reassurance">No spam. Unsubscribe anytime.</p>
</div>
