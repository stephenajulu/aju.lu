<style>
.newsletter-label {
  font-weight: 400;
  margin-bottom: 0.5rem;
  color: #888;
  font-size: 38px
}

.newsletter-form {
  display: flex;
  border-radius: 30px;
  overflow: hidden;
  max-width: 500px;
  margin: 0.5rem 0; /* left-aligned flow */
}

.newsletter-form input[type="email"] {
  flex: 1;
  padding: 12px 16px;
  border: 2px solid #6320d6;
  border-right: none;
  border-radius: 30px 0 0 30px;
  font-size: 1rem;
}

.newsletter-form input[type="email"]::placeholder {
  color: #888;
}

.newsletter-form button {
  padding: 12px 20px;
  background-color: #6320d6;
  color: #fff;
  border: none;
  border-radius: 0 30px 30px 0;
  font-weight: 600;
  cursor: pointer;
  transition: background-color 0.3s ease;
}

.newsletter-form button:hover {
  background-color: #4b18a3;
}

@media only screen and (max-width: 768px) {
  .newsletter-form {
    flex-direction: column;
    border-radius: 30px;
    max-width: 100%;
  }

  .newsletter-form input[type="email"],
  .newsletter-form button {
    border-radius: 30px;
    border: 2px solid #6320d6;
    margin: 0.25rem 0;
  }

  .newsletter-form button {
    border: none;
  }
}
</style>

<div class="newsletter" id="newsletter">
  <p class="newsletter-label">Subscribe to get future posts via email (or grab the RSS feed)</p>
  <form action="https://buttondown.com/api/emails/embed-subscribe/ajulu" 
        method="post" 
        target="popupwindow" 
        onsubmit="window.open('https://buttondown.com/ajulu', 'popupwindow')" 
        class="embeddable-buttondown-form newsletter-form">
    <input type="email" name="email" id="bd-email" placeholder="Enter your email" required>
    <button type="submit">Subscribe</button>
  </form>
</div>
