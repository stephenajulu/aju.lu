<div class="archive-grouped">
  {{ $pages := where site.RegularPages "Type" "in" (slice "posts") }}
  {{ range $pages.GroupByDate "2006" }}
  <div class="archive-year-group">
    <h2 class="archive-year">{{ .Key }} <span class="archive-count">{{ len .Pages }} posts</span></h2>
    <div class="archive-list">
      {{ range .Pages }}
      <div class="archive-item">
        <time class="archive-date">{{ .Date.Format "Jan 02" }}</time>
        <h3 class="archive-title"><a href="{{ .RelPermalink }}">{{ .Title }}</a></h3>
      </div>
      {{ end }}
    </div>
  </div>
  {{ end }}
</div>
