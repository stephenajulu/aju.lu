<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Offline | Stephen Ajulu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@700;800&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #030712;
      --text-color: #ffffff;
      --accent-color: #6320d6;
      --card-bg: rgba(17, 24, 39, 0.7);
      --card-border: rgba(148, 163, 184, 0.1);
    }
    
    * {
      box-sizing: border-box;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: 'Poppins', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      overflow: hidden;
      position: relative;
    }

    /* Subtle background glow */
    body::before {
      content: "";
      position: absolute;
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, rgba(99, 32, 214, 0.15) 0%, rgba(3, 7, 18, 0) 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 1;
    }

    .container {
      max-width: 500px;
      width: 100%;
      text-align: center;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 40px 30px;
      border-radius: 20px;
      backdrop-filter: blur(12px);
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
      z-index: 2;
      animation: fade-up 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes fade-up {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    h1 {
      font-family: 'Fraunces', serif;
      font-size: 2.2rem;
      margin: 20px 0 10px 0;
      font-weight: 800;
    }

    p {
      font-size: 1rem;
      opacity: 0.8;
      line-height: 1.6;
      margin-bottom: 30px;
    }

    .icon-wrapper {
      width: 70px;
      height: 70px;
      background: rgba(99, 32, 214, 0.1);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px auto;
      border: 1px solid rgba(99, 32, 214, 0.2);
    }

    .icon-wrapper svg {
      width: 32px;
      height: 32px;
      stroke: var(--accent-color);
    }

    .btn {
      display: inline-block;
      padding: 12px 30px;
      background-color: var(--accent-color);
      color: #ffffff;
      text-decoration: none;
      border-radius: 30px;
      font-weight: 600;
      transition: background-color 0.3s ease, transform 0.2s ease;
      cursor: pointer;
      border: none;
    }

    .btn:hover {
      background-color: #4b18a3;
      transform: translateY(-2px);
    }

    .btn:active {
      transform: translateY(0);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon-wrapper">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M1 1l22 22M16.72 11.06A10.94 10.94 0 0 1 19 12.5M5 12.5a10.94 10.94 0 0 1 5.83-2.84M8.53 16.03a6 6 0 0 1 7-4.3M12 20h.01"></path>
      </svg>
    </div>
    <h1>You are offline</h1>
    <p>It seems you are currently disconnected from the internet. Check your network connection and try again.</p>
    <button class="btn" onclick="window.location.reload()">Retry Connection</button>
  </div>
</body>
</html>
