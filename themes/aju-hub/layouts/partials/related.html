{{ $related := .Site.RegularPages.Related . | first 3 }}
{{ with $related }}
<div class="related-posts">
  <h3 class="related-title">You might also like{{ if $.Site.Params.addDot }}<span class="dot">.</span>{{ end }}</h3>
  <div class="related-grid">
    {{ range . }}
    <div class="related-item">
      <h4 class="related-post-title"><a href="{{ .RelPermalink }}">{{ .Title }}</a></h4>
    </div>
    {{ end }}
  </div>
</div>
{{ end }}
