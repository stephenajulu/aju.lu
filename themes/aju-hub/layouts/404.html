{{ define "main" }}
<div class="error-404">
    <div class="intro">
        <h1>404{{ if .Site.Params.addDot }}<span class="dot">.</span>{{ end }}</h1>
        <h2>Oops, Page Not Found!</h2>
    </div>
    
    <div class="error-image">
        <img src="{{ "images/404.svg" | relURL }}" alt="Page not found" width="404">
    </div>

    <div class="error-actions">
        <p>The page you are looking for might have been moved, renamed, or is temporarily unavailable.</p>
        <div class="error-links">
            <a href="{{ .Site.BaseURL }}" class="dramatic">Go Back Home</a>
            <span class="divider">|</span>
            <a href="{{ "search/" | relLangURL }}" class="dramatic">Search the Site</a>
        </div>
    </div>
</div>
{{ end }}
