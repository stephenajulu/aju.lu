<style>
.newsletter-form {
  display: flex;
  border-radius: 30px;
  overflow: hidden;
  max-width: 500px;
}

.newsletter-form input[type="email"] {
  flex: 1;
  padding: 12px 16px;
  background: var(--base-color, #030712);
  color: var(--text-color, #cbd5e1);
  border: 2px solid var(--highlight-color, #6320d6);
  border-right: none;
  border-radius: 30px 0 0 30px;
  font-size: 1rem;
  font-family: var(--font-family-paragraph, inherit);
  outline: none;
}

.newsletter-form input[type="email"]::placeholder {
  color: var(--meta-color, #888);
}

.newsletter-form button {
  padding: 12px 20px;
  background-color: var(--highlight-color, #6320d6);
  color: #fff;
  border: none;
  border-radius: 0 30px 30px 0;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.3s ease;
}

.newsletter-form button:hover {
  filter: brightness(1.1);
  box-shadow: 0 0 12px rgba(99, 32, 214, 0.35);
}

@media only screen and (max-width: 768px) {
 .newsletter-form {
  max-width: 100%;
  border-radius: 30px;
}
  .newsletter-form button {
    border: none;
  }
}
</style>

<div class="newsletter section" id="newsletter">
    <form action="https://buttondown.com/api/emails/embed-subscribe/ajulu" method="post" target="popupwindow" onsubmit="window.open('https://buttondown.com/ajulu', 'popupwindow')" class="embeddable-buttondown-form newsletter-form" data-umami-event="newsletter_subscribe" data-umami-event-location="homepage">
    <input type="email" name="email" id="bd-email" placeholder="Enter your email" required>
    <button type="submit" value="Subscribe">Subscribe</button>
  </form>
  </div>
