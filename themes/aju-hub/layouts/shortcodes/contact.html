<div class="contact-form-section">
    <form name="contact-shortcode" data-netlify="true" class="themed-form">
        <div class="form-group">
            <label for="name">Your Name</label>
            <input type="text" id="name" name="name" placeholder="e.g. John Doe" required>
        </div>

        <div class="form-group">
            <label for="email">Your Email</label>
            <input type="email" id="email" name="email" placeholder="e.g. you@email.com" required>
        </div>
        
        <div class="form-group">
            <label for="message">Your Message</label>
            <textarea id="message" name="message" placeholder="Write your message here..." style="height:150px"></textarea>
        </div>

        <input type="submit" value="Send Message" class="submit-btn">
    </form>
</div>
