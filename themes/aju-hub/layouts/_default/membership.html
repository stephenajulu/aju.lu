{{ define "main" }}
<div class="intro">
    <h1>{{ .Title }}{{ if .Site.Params.addDot }}<span class="dot">.</span>{{ end }}</h1>
    <div class="intro-content">
        {{ .Content }}
    </div>
</div>

<div class="membership-dashboard" id="membership-ui">
    <!-- This will be populated by JS based on login state -->
    <div class="loading-spinner">Checking membership status...</div>
</div>

<template id="tpl-logged-out">
    <div class="plans-grid">
        <div class="plan-card">
            <h3>Explorer</h3>
            <div class="plan-price">Free</div>
            <ul>
                <li>Access to all public posts</li>
                <li>Newsletter subscription</li>
            </ul>
            <button class="btn login-trigger" onclick="netlifyIdentity.open('signup')">Create Free Account</button>
        </div>
        
        <div class="plan-card featured">
            <h3>Premium</h3>
            <div class="plan-price">KES 1,000<span>/mo</span></div>
            <ul>
                <li><strong>All Explorer benefits</strong></li>
                <li>Member-only deep dives</li>
                <li>Early access to notes</li>
                <li>Direct support via M-Pesa</li>
            </ul>
            <button class="btn login-trigger" onclick="netlifyIdentity.open('signup')">Unlock with M-Pesa</button>
        </div>
    </div>
    <div style="text-align: center; margin-top: 40px;">
        <p>Already have an account? <a href="#" onclick="netlifyIdentity.open('login')">Log in here</a></p>
    </div>
</template>

<template id="tpl-logged-in-free">
    <div class="member-status-box">
        <h3>Welcome, <span class="user-email"></span></h3>
        <p>Status: <strong>Free Member</strong></p>
        <p>Upgrade to Premium to unlock the full experience.</p>
        <a id="paystack-link" href="https://paystack.shop/pay/u0tbzutalc" class="btn btn-premium" data-umami-event="membership_upgrade_click">Upgrade to Premium (M-Pesa)</a>
        <br><br>
        <button class="btn-link" onclick="netlifyIdentity.logout()">Logout</button>
    </div>
</template>

<template id="tpl-logged-in-premium">
    <div class="member-status-box premium">
        <h3>Welcome back, <span class="user-email"></span></h3>
        <p>Status: <strong class="badge-premium">⭐ Premium Member</strong></p>
        <p>You have full access to all content on the site.</p>
        <div class="premium-actions">
            <a href="/posts/" class="btn">Read Premium Posts</a>
            <button class="btn-link" onclick="netlifyIdentity.logout()">Logout</button>
        </div>
    </div>
</template>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const container = document.getElementById('membership-ui');
        console.log("Membership UI: Initializing...");

        function updateUI(user) {
            console.log("Membership UI: Updating for user:", user ? user.email : "Logged Out");
            container.innerHTML = '';
            
            if (!user) {
                const tpl = document.getElementById('tpl-logged-out');
                if (tpl) {
                    container.appendChild(tpl.content.cloneNode(true));
                } else {
                    console.error("Membership UI: Template 'tpl-logged-out' not found.");
                }
            } else {
                const isPremium = user.app_metadata && user.app_metadata.roles && user.app_metadata.roles.includes('premium');
                const tplId = isPremium ? 'tpl-logged-in-premium' : 'tpl-logged-in-free';
                console.log("Membership UI: User is premium:", isPremium);
                
                const tpl = document.getElementById(tplId);
                if (tpl) {
                    const clone = tpl.content.cloneNode(true);
                    const emailSpan = clone.querySelector('.user-email');
                    if (emailSpan) emailSpan.innerText = user.email;
                    
                    const payLink = clone.querySelector('#paystack-link');
                    if (payLink) {
                        const separator = payLink.href.includes('?') ? '&' : '?';
                        payLink.href += `${separator}email=${encodeURIComponent(user.email)}`;
                    }
                    container.appendChild(clone);
                } else {
                    console.error(`Membership UI: Template '${tplId}' not found.`);
                }
            }
        }

        // Wait for netlifyIdentity to be ready
        if (window.netlifyIdentity) {
            console.log("Membership UI: Netlify Identity found.");
            
            // Handle initial state
            updateUI(netlifyIdentity.currentUser());

            // Bind events
            netlifyIdentity.on('init', user => {
                console.log("Membership UI: Init event fired");
                updateUI(user);
            });
            netlifyIdentity.on('login', user => {
                console.log("Membership UI: Login event fired");
                updateUI(user);
                netlifyIdentity.close(); // Close modal on success
            });
            netlifyIdentity.on('logout', () => {
                console.log("Membership UI: Logout event fired");
                updateUI(null);
            });
            netlifyIdentity.on('error', err => console.error('Membership UI: Netlify Identity Error:', err));
        } else {
            console.error("Membership UI: Netlify Identity widget NOT found. Ensure it's enabled in your dashboard.");
            container.innerHTML = '<p class="error">Identity service not found. Please refresh or check back later.</p>';
        }
    });
</script>

<style>
.plans-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    gap: 30px;
    margin-top: 40px;
}

.plan-card {
    padding: 40px;
    background: var(--base-offset-color);
    border-radius: 12px;
    border: 1px solid rgba(156, 163, 175, 0.2);
    display: flex;
    flex-direction: column;
}

.plan-card.featured {
    border: 2px solid var(--highlight-color);
    transform: scale(1.05);
    background: var(--base-color);
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
}

.plan-price {
    font-size: 2.5rem;
    font-weight: 800;
    margin: 20px 0;
    color: var(--heading-color);
}

.plan-price span {
    font-size: 1rem;
    opacity: 0.7;
}

.plan-card ul {
    margin: 0 0 30px 0;
    padding: 0;
    list-style: none;
    flex-grow: 1;
}

.plan-card li {
    margin-bottom: 12px;
    padding-left: 25px;
    position: relative;
}

.plan-card li::before {
    content: "✓";
    position: absolute;
    left: 0;
    color: var(--highlight-color);
    font-weight: bold;
}

.member-status-box {
    padding: 50px;
    text-align: center;
    background: var(--base-offset-color);
    border-radius: 12px;
    max-width: 600px;
    margin: 0 auto;
}

.member-status-box.premium {
    border: 2px solid var(--highlight-color);
}

.badge-premium {
    color: var(--highlight-color);
    text-transform: uppercase;
    letter-spacing: 0.1em;
}

.btn-link {
    background: none;
    border: none;
    color: var(--meta-color);
    text-decoration: underline;
    cursor: pointer;
    font-family: inherit;
}
</style>
{{ end }}
